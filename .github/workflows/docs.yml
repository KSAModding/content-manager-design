name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: markdown-lint
    # A fixed image, so a change of the latest label does not change the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  link-check:
    name: link-check
    # A fixed image, so a change of the latest label does not change the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"
          fail: true
          failIfEmpty: false
