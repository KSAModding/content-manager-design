name: rfc

on:
  pull_request:
    # ready_for_review is not in the default set, and it is the one moment
    # the Draft-status rule below exists to catch.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rfc-metadata:
    name: rfc-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_rfc_metadata.py
        env:
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
