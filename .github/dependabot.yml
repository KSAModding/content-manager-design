# Keeps the actions the docs and rfc checks run on current.
# The markdownlint-cli2 and lychee versions the docs checks use come with their actions, so this entry covers them too.
# It runs daily, so a fixed release reaches a pull request within a working day.
# Security updates do not wait for this schedule, because Dependabot opens them when an advisory is published.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Dependabot reads .github/workflows/ from here.
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # All action bumps arrive as one pull request, because the checks of that one pull request show at once whether a check breaks.
      actions:
        patterns: ["*"]
